name: OpenBMC CI Build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# Needed to push the Yocto OCI caches (sstate + downloads) to GHCR.
permissions:
  contents: read
  packages: write

# Serialize builds of the same ref so two runs don't clobber each other's
# cache push.
concurrency:
  group: openbmc-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Non-expiring OCI cache stored as GHCR artifacts. Unlike actions/cache,
  # GHCR packages do not expire after 7 days and are not subject to the 10 GB
  # repo cache limit, so builds can always be resumed from prior sstate.
  # Layout, sharding and pruning: see .github/scripts/yocto-cache.py.
  CACHE_IMAGE: ghcr.io/${{ github.repository }}/yocto-cache
  # kas forwards DL_DIR/SSTATE_DIR from the environment to bitbake, and
  # .config.yaml sets them with `?=`, so these win in CI. They MUST stay in
  # sync: when .config.yaml used a hard `=` (/opt/yocto/...), bitbake wrote
  # its cache there, every save archived these empty dirs, and every run
  # rebuilt all ~6250 tasks from scratch.
  DL_DIR: ${{ github.workspace }}/build/downloads
  SSTATE_DIR: ${{ github.workspace }}/build/sstate-cache
  # One cache per branch (tag `<kind>-<branch>`), falling back to whatever
  # branch saved most recently (`<kind>-latest`) for a branch's first run.
  CACHE_SCOPE: ${{ github.head_ref || github.ref_name }}
  CACHE_FALLBACK_SCOPES: latest
  # Every run restores. Only push/dispatch runs save: fork PRs only get a
  # read-only token, and a PR saving would race the branch's own push run.
  CACHE_SAVE: ${{ github.event_name != 'pull_request' }}
  # LRU budgets: the final save of a successful build evicts the
  # least-recently-used objects beyond these (objects this run used are never
  # evicted, so a single build can exceed them). Everything restored shares
  # the runner's ~110 GB free disk with build/tmp, so keep the sum modest.
  CACHE_SSTATE_BUDGET_GB: "20"
  CACHE_DOWNLOADS_BUDGET_GB: "16"
  # How often to checkpoint the caches to the registry during the build so
  # progress survives a cancellation/timeout that interrupts the final save.
  # Checkpoints only upload shards that changed since the last one.
  CACHE_CHECKPOINT_INTERVAL_SECONDS: "1200"

jobs:
  # Single job: one `kas build` assembles obmc-phosphor-image (the
  # flashable *.static.mtd) end to end. Splitting the build across per-layer
  # jobs did NOT help — each job runs on a fresh ephemeral runner with no
  # shared sstate, so the split just rebuilt the cross-toolchain in every job
  # instead of skipping it. A single job lets bitbake reuse sstate naturally
  # within the run; the GHCR cache carries that sstate forward between runs.
  build:
    runs-on: ubuntu-latest
    # GitHub's hard limit for hosted runners. The build step's own timeout
    # below is shorter so the final cache save still gets to run.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cache and install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential chrpath cpio debianutils diffstat file gawk git iputils-ping libacl1 liblz4-tool locales python3 python3-git python3-jinja2 python3-pexpect python3-subunit socat texinfo unzip wget xz-utils zstd bison flex bc libssl-dev device-tree-compiler kas
          version: 1.0

      - name: Configure UTF-8 locale
        run: |
          sudo locale-gen en_US.UTF-8
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"

      - name: Disable AppArmor unprivileged user namespace restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        # A fork PR's read-only token may not be able to pull; the build then
        # just runs uncached.
        continue-on-error: true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Restore Yocto OCI caches
        continue-on-error: true
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/yocto-cache.py" restore sstate downloads

      - name: Build image
        id: build
        timeout-minutes: 320
        run: |
          set -uo pipefail
          checkpoint_pid=""
          if [ "${CACHE_SAVE}" = "true" ]; then
            (while sleep "${CACHE_CHECKPOINT_INTERVAL_SECONDS}"; do
               python3 "${GITHUB_WORKSPACE}/.github/scripts/yocto-cache.py" save sstate downloads || true
             done) &
            checkpoint_pid=$!
            trap '[ -n "${checkpoint_pid}" ] && kill "${checkpoint_pid}" 2>/dev/null || true' EXIT INT TERM
          fi
          kas build

      - name: Upload image artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: x570d4i2t-obmc-image
          if-no-files-found: warn
          path: |
            build/tmp/deploy/images/**/*.static.mtd
            build/tmp/deploy/images/**/*.static.mtd.tar
            build/tmp/deploy/images/**/*.mtd.all.tar
            build/tmp/deploy/images/**/*.manifest

      - name: Save Yocto OCI caches
        if: ${{ always() && env.CACHE_SAVE == 'true' }}
        # A cache problem must not fail a good build; it shows up as a warning
        # annotation on the run instead.
        continue-on-error: true
        # Prune only after a successful build: a failed or cancelled run hasn't
        # touched everything it needs yet, so its LRU view is incomplete.
        # (Waits for any in-flight checkpoint to finish first.)
        run: |
          df -h "${GITHUB_WORKSPACE}"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/yocto-cache.py" save \
            ${{ steps.build.outcome == 'success' && '--prune' || '' }} sstate downloads

      - name: Delete stale untagged cache versions
        # Every save makes a new manifest and moves the tags; the old manifest
        # stays behind untagged. Restores only ever use tags, so drop all but
        # the newest few (kept so a concurrent restore isn't pulled from
        # under it). Shard blobs still referenced by a tagged manifest stay.
        if: ${{ always() && env.CACHE_SAVE == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          if [ "${OWNER_TYPE}" = "Organization" ]; then base="orgs/${GITHUB_REPOSITORY_OWNER}"; else base="users/${GITHUB_REPOSITORY_OWNER}"; fi
          pkg="$(jq -rn --arg p "${CACHE_IMAGE#ghcr.io/*/}" '$p | ascii_downcase | @uri')"
          gh api --paginate "${base}/packages/container/${pkg}/versions" \
              --jq '.[] | select(.metadata.container.tags | length == 0) | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +6 | cut -f2 \
            | while read -r id; do gh api -X DELETE "${base}/packages/container/${pkg}/versions/${id}"; done
