[Manager]
# Overrides meta-phosphor's 40-hardware-watchdog.conf, which asks systemd for a
# 30s watchdog pre-timeout with the "panic" governor. Nothing on this machine
# can provide it, so systemd logs on every boot:
#
#   Failed to set watchdog pretimeout_governor to 'panic': No such file or directory
#
# Two independent reasons, both verified rather than assumed:
#
#  1. aspeed_wdt does implement set_pretimeout and ast2500_config sets a
#     non-zero irq_mask, but it only advertises WDIOF_PRETIMEOUT when the DT
#     node supplies an interrupt. No upstream Aspeed DTS declares one -- not
#     aspeed-g5.dtsi's wdt1/wdt2/wdt3, not even g6 -- so
#     platform_get_irq_optional() fails and the driver keeps the plain
#     aspeed_wdt_info.
#  2. The kernel is built with CONFIG_WATCHDOG_PRETIMEOUT_GOV unset, so the
#     governor framework does not exist and /sys/class/watchdog/watchdog0 has
#     no pretimeout_governor file to write.
#
# Fixing this for real means inventing a watchdog interrupt number in the DTS.
# That is exactly the kind of guess that produces a spurious-IRQ storm, and
# this board already has one on the shared LPC line, so don't.
#
# The 120s hard RuntimeWatchdogSec from 40-hardware-watchdog.conf is deliberately
# left alone -- it arms normally and is what actually recovers a wedged BMC.
RuntimeWatchdogPreSec=off
RuntimeWatchdogPreGovernor=
