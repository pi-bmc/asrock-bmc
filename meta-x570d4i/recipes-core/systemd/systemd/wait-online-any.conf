[Service]
# systemd-networkd-wait-online defaults to requiring EVERY managed link to be
# online. This board has two: eth0 (the shared management NIC) and eth1, which
# is NC-SI and is routable only when the host NIC has negotiated a link. At BMC
# boot the host is usually still off, so eth1 is not online, the unit burns its
# whole timeout and then fails:
#
#   Starting Wait for Network to be Online...
#   (353s later) Timeout occurred while waiting for network connectivity.
#   systemd-networkd-wait-online.service: Failed with result 'exit-code'.
#
# --any makes network-online.target ready as soon as ONE link is online, which
# is the correct semantic here: the only consumer is rsyslog, and it needs *a*
# network, not both. Clearing ExecStart first is required -- ExecStart is a
# list, and appending without the reset would run the binary twice.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
